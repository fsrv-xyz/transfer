name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.26.5

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
